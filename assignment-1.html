<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin:10px;
        }
        body{
            padding:30px;
            border:15px solid black;
            width:400px;
            height:500px;
            /* display: flex;
            align-items: start; */
        }
        .userinput{
            margin-top: 10px;
    padding-left: 20px;
    width: 300px;
    border: 2px solid #333;
    min-height: 40px;
    color:blue
        }
        li{
            color: blueviolet;
            font-size: 30px;
            font-style: italic;
        }
        button{
            padding:15px;
            color: red;
            background-color: aqua;
            font-size: 20px;
            margin:10px ;
        }
        #task{
            font-size: 20px;
            font-weight: 100px;
            color:crimson ;
            padding:10px;
            border: 4px solid rgb(19, 207, 60);
        }
        #task:hover{
            border:6px solid violet ;
            color:crimson
        }
        button:hover{
            background-color: chocolate;
            color:indigo
        }
    </style>
</head>
<body>
    <label style="font-size: 30px;"><b>Add your TO-DO-List:</b></label>
    <input type="text" id="task" placeholder="to-dolist"><br>
    <br>
    <button onclick="functionName()">submit</button><br><br>
    <ul id="userinput"></ul>
<script>
    let arr=[];
    function functionName(){
let input=document.getElementById("task");
let tasks=input.value.trim();
if(tasks != ""){
    arr.push(tasks);
    let ul=document.getElementById("userinput");
    ul.innerHTML="";
    arr.forEach(item => {
        let li=document.createElement("li");
        li.textContent=item;
        ul.appendChild(li)
    });
    input.value="";
}else{
    alert("please enter a task");
}
    }

</script>
</body>
</html>
