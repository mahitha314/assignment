<!DOCTYPE html>
<html>
<head>
    <title>Space Launch Information Dashboard</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* background: linear-gradient(135deg, #1d2671, #c33764); */
            font-family: 'Segoe UI', sans-serif;
            color: #fff;
        }

        .container {
            background-color: rgba(0, 0, 0, 0.4);
            padding: 40px;
            border-radius: 15px;
            width: 350px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 22px;
            margin-bottom: 25px;
        }

        button {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            background: #00c6ff;
            background: linear-gradient(to right, #00c6ff, #0072ff);
            border: none;
            border-radius: 30px;
            color: white;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0, 198, 255,);
        }

        #loading {
            margin-top: 20px;
            font-size: 16px;
            display: none;
        }

        #launchDetails {
            margin-top: 25px;
            padding: 20px;
            background-color: rgba(255, 255, 255,);
            border-radius: 10px;
            display: none;
        }

        #launchDetails h2 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #ffd700;
        }

        #missionName {
            font-size: 17px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>🚀 Space Launch Dashboard</h1>

    <button onclick="loadLaunch()">Load Latest Launch</button>

    <div id="loading">⏳ Fetching launch details...</div>

    <div id="launchDetails">
        <h2>Mission Name</h2>
        <p id="missionName"></p>
    </div>
</div>

<script>
    async function loadLaunch() {

        document.getElementById("loading").style.display = "block";
        document.getElementById("launchDetails").style.display = "none";

        try {
            const response = await fetch("https://api.spacexdata.com/v4/launches/latest");

            if (!response.ok) {
                throw new Error("Failed to load launch data");
            }

            const data = await response.json();

            document.getElementById("missionName").innerText = data.name;
            document.getElementById("launchDetails").style.display = "block";
        }
        catch (error) {
            alert("Error: " + error.message);
        }
        finally {
            document.getElementById("loading").style.display = "none";
        }
    }
</script>

</body>
</html>
